# Nivel global del logger
log4j.rootLogger=INFO, console, file

# --- Consola ---
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c - %m%n

# --- Archivo ---
log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.File=logs/colectivos.log
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{ISO8601} %-5p [%c] - %m%n

# Nivel por defecto para el paquete de tu aplicación
log4j.logger.colectivo=INFO

# Permitir más detalle en las pruebas
log4j.logger.colectivo.test=DEBUG
